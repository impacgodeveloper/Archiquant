# Manual gh-pages deploy. Run from the Actions tab → "Deploy Web" → Run workflow.
# Kept manual (not auto-on-push) so deploys are a deliberate, reviewed step.
name: Deploy Web

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Build web
        run: flutter build web --base-href "/Archiquant/" --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          # Required so Flutter routes/assets resolve and Jekyll doesn't strip _ files.
          cname: ""
